<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}

.nav-links a{color:#52525B;transition:color .15s ease}

.card{transition:transform .2s ease,border-color .2s ease}

@keyframes spin3d{from{transform:rotateX(-22deg) rotateY(0deg)}to{transform:rotateX(-22deg) rotateY(360deg)}}
@keyframes spin3dr{from{transform:rotateX(-22deg) rotateY(360deg)}to{transform:rotateX(-22deg) rotateY(0deg)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes rev{from{opacity:0;transform:translateY(48px) scale(.97)}to{opacity:1;transform:none}}

.scene{perspective:1000px;width:220px;height:220px;animation:floaty 6s ease-in-out infinite}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:spin3d 16s linear infinite}
.cube2{position:absolute;left:55px;top:55px;width:110px;height:110px;transform-style:preserve-3d;animation:spin3dr 9s linear infinite}
.face{position:absolute;inset:0;border:2px solid #E30613;background:rgba(227,6,19,.07);box-shadow:inset 0 0 36px rgba(227,6,19,.3),0 0 18px rgba(227,6,19,.25)}
.cube2 .face{border-color:#FFFFFF;background:rgba(255,255,255,.05);box-shadow:inset 0 0 20px rgba(255,255,255,.18)}
.f1{transform:translateZ(110px)}.f2{transform:rotateY(90deg) translateZ(110px)}.f3{transform:rotateY(180deg) translateZ(110px)}.f4{transform:rotateY(-90deg) translateZ(110px)}.f5{transform:rotateX(90deg) translateZ(110px)}.f6{transform:rotateX(-90deg) translateZ(110px)}
.cube2 .f1{transform:translateZ(55px)}.cube2 .f2{transform:rotateY(90deg) translateZ(55px)}.cube2 .f3{transform:rotateY(180deg) translateZ(55px)}.cube2 .f4{transform:rotateY(-90deg) translateZ(55px)}.cube2 .f5{transform:rotateX(90deg) translateZ(55px)}.cube2 .f6{transform:rotateX(-90deg) translateZ(55px)}
.marq{display:flex;width:max-content;animation:marquee 30s linear infinite}
.marq span{font-weight:800;font-size:clamp(28px,4.5vw,52px);letter-spacing:-0.03em;padding:0 28px;white-space:nowrap;color:transparent;-webkit-text-stroke:1.5px #B4B4BC}
.marq span.hot{color:#0A0A0B;-webkit-text-stroke:0}

.grad{background:linear-gradient(90deg,#E30613,#FF8A5B,#E30613);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent !important;animation:grad 5s linear infinite}
.aur{background:linear-gradient(120deg,#E30613,#E30613,#B8000E,#D00511,#E30613);background-size:300% 300%;animation:aur 10s ease infinite}
.reveal{animation:rev linear both;animation-timeline:view();animation-range:entry 0% cover 30%}

    this.state = { filter: 'todos', model: 'peca', yaw: 35, pitch: 28, zoom: 1, auto: true, mode: 'render', fin: 0, sent: '', dim: false, cm: 'mesa', cfin: 0, cyaw: 30, cpitch: 26, wz: [null, null, null] };
    this.form = { name: '', email: '', phone: '', service: 'Modelo 3D de produto', msg: '' };
    this.dragX = null;
    this.dragY = null;
    this.timer = null;
  }

  componentDidMount() {
    let reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduce) { this.setState({ auto: false }); }
    this.timer = setInterval(() => {
      if (this.state.cplay) {
        let v = (this.state.cex || 0) + 5 * (this._cdir || 1);
        if (v >= 100) { v = 100; this._cdir = -1; } else if (v <= 0) { v = 0; this._cdir = 1; }
        this.setState({ cex: v });
      }
      if (this.state.auto && this.dragX === null) {
        this.setState({ yaw: (this.state.yaw + 2) % 360 });
      }
    }, 90);
  }

  componentWillUnmount() {
    if (this.timer) { clearInterval(this.timer); }
  }

  /* ---------- geometria 3D (cm na planta, mm na peça) ---------- */

  gShade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    return 'rgb(' + c.map((v) => Math.max(0, Math.min(255, Math.round(v * f)))).join(',') + ')';
  }

  gBox(x, y, z, w, d, h, color, op) {
    const x1 = x + w, y1 = y + d, z1 = z + h;
    const o = op == null ? 1 : op;
    return [
      { p: [[x, y, z1], [x1, y, z1], [x1, y1, z1], [x, y1, z1]], n: [0, 0, 1], color, op: o },
      { p: [[x, y, z], [x1, y, z], [x1, y, z1], [x, y, z1]], n: [0, -1, 0], color, op: o },
      { p: [[x1, y1, z], [x, y1, z], [x, y1, z1], [x1, y1, z1]], n: [0, 1, 0], color, op: o },
      { p: [[x, y1, z], [x, y, z], [x, y, z1], [x, y1, z1]], n: [-1, 0, 0], color, op: o },
      { p: [[x1, y, z], [x1, y1, z], [x1, y1, z1], [x1, y, z1]], n: [1, 0, 0], color, op: o }
    ];
  }

  gWall(x0, y0, x1, y1, z0, z1, color, op) {
    const out = [];
    const w = x1 - x0, d = y1 - y0;
    const alongX = w >= d;
    const len = alongX ? w : d;
    const n = Math.max(1, Math.ceil(len / 120));
    const step = len / n;
    for (let i = 0; i < n; i++) {
      const part = alongX
        ? this.gBox(x0 + i * step, y0, z0, step, d, z1 - z0, color, op)
        : this.gBox(x0, y0 + i * step, z0, w, step, z1 - z0, color, op);
      for (let k = 0; k < part.length; k++) { out.push(part[k]); }
    }
    return out;
  }

  gDisc(cx, cy, cz, r, plane, color, n) {
    const pts = [];
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * 2 * Math.PI;
      const c = Math.cos(a) * r, s = Math.sin(a) * r;
      pts.push(plane === 'xy' ? [cx + c, cy + s, cz] : [cx + c, cy, cz + s]);
    }
    return { p: pts, n, color, op: 1, flat: true };
  }

  gFloor(x0, y0, x1, y1, color) {
    return { p: [[x0, y0, 0], [x1, y0, 0], [x1, y1, 0], [x0, y1, 0]], n: [0, 0, 1], color, op: 1, floor: true };
  }

  /* cilindro: axis 'z' (em pé) ou 'y' (deitado); a tampa fica no fim da lista */
  gCyl(cx, cy, cz, r, h, axis, color, seg) {
    const out = [];
    const N = seg || 20;
    const ring = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * 2 * Math.PI;
      ring.push([Math.cos(a), Math.sin(a)]);
    }
    for (let i = 0; i < N; i++) {
      const a = ring[i], b = ring[(i + 1) % N];
      const mx = a[0] + b[0], my = a[1] + b[1];
      const ml = Math.sqrt(mx * mx + my * my) || 1;
      if (axis === 'z') {
        out.push({ p: [[cx + r * a[0], cy + r * a[1], cz], [cx + r * b[0], cy + r * b[1], cz], [cx + r * b[0], cy + r * b[1], cz + h], [cx + r * a[0], cy + r * a[1], cz + h]], n: [mx / ml, my / ml, 0], color, op: 1, soft: true, vn: [[a[0], a[1], 0], [b[0], b[1], 0], [b[0], b[1], 0], [a[0], a[1], 0]] });
      } else {
        out.push({ p: [[cx + r * a[0], cy, cz + r * a[1]], [cx + r * b[0], cy, cz + r * b[1]], [cx + r * b[0], cy + h, cz + r * b[1]], [cx + r * a[0], cy + h, cz + r * a[1]]], n: [mx / ml, 0, my / ml], color, op: 1, soft: true, vn: [[a[0], 0, a[1]], [b[0], 0, b[1]], [b[0], 0, b[1]], [a[0], 0, a[1]]] });
      }
    }
    if (axis === 'z') {
      out.push({ p: ring.map((q) => [cx + r * q[0], cy + r * q[1], cz + h]), n: [0, 0, 1], color, op: 1 });
    } else {
      out.push({ p: ring.map((q) => [cx + r * q[0], cy, cz + r * q[1]]), n: [0, -1, 0], color, op: 1 });
      out.push({ p: ring.map((q) => [cx + r * q[0], cy + h, cz + r * q[1]]), n: [0, 1, 0], color, op: 1 });
    }
    return out;
  }

  /* nervura triangular no plano XZ; dir -1 = abre para a esquerda, 1 = para a direita */
  gRib(xv, dir, z0, hh, y0, y1, color) {
    const xo = xv + dir * hh;
    const nz = Math.SQRT1_2;
    return [
      { p: [[xo, y0, z0], [xv, y0, z0], [xv, y0, z0 + hh]], n: [0, -1, 0], color, op: 1 },
      { p: [[xo, y1, z0], [xv, y1, z0], [xv, y1, z0 + hh]], n: [0, 1, 0], color, op: 1 },
      { p: [[xo, y0, z0], [xv, y0, z0 + hh], [xv, y1, z0 + hh], [xo, y1, z0]], n: [dir * nz, 0, nz], color, op: 1 }
    ];
  }

  /* Mancal de eixo: base furada, alojamento, nervuras, eixo e graxeira (medidas em mm) */
  partFaces() {
    const steel = '#AEB4BA', boss = '#BCC2C8', body = '#98A0A8', shaft = '#DADEE1', dark = '#17191C';
    const F = [];
    const add = (arr) => { for (let i = 0; i < arr.length; i++) { F.push(arr[i]); } };
    F.push(this.gFloor(-40, -40, 180, 130, '#E7E7EA'));

    const base = this.gBox(0, 0, 0, 140, 90, 12, steel);
    base[0].kids = [];
    [[18, 18], [122, 18], [18, 72], [122, 72]].forEach((h) => {
      base[0].kids.push(this.gDisc(h[0], h[1], 12, 7, 'xy', dark, [0, 0, 1]));
    });
    add(base);

    add(this.gRib(38, -1, 12, 24, 32, 58, steel));
    add(this.gRib(102, 1, 12, 24, 32, 58, steel));

    add(this.gCyl(70, 18, 46, 34, 54, 'y', body, 28));

    const bossFront = this.gCyl(70, 14, 46, 28, 4, 'y', boss, 28);
    bossFront[28].kids = [this.gDisc(70, 14, 46, 22, 'xz', dark, [0, -1, 0])];
    add(bossFront);
    const bossBack = this.gCyl(70, 72, 46, 28, 4, 'y', boss, 28);
    bossBack[29].kids = [this.gDisc(70, 76, 46, 22, 'xz', dark, [0, 1, 0])];
    add(bossBack);

    add(this.gCyl(70, 0, 46, 16, 14, 'y', shaft, 24));

    add(this.gCyl(70, 45, 79, 8, 10, 'z', '#E30613', 14));
    add(this.gCyl(70, 45, 89, 4, 6, 'z', shaft, 10));
    return F;

  /* ---------- motor 3D: ferramentas ---------- */

  gO(arr, o) {
    const id = this._oid++;
    for (let i = 0; i < arr.length; i++) { arr[i].oid = id; if (o) { Object.assign(arr[i], o); } }
    return arr;
  }

  /* barra/tubo retangular; no modo renderizado é dividida em trechos para a ordenação ficar correta */
  gTube(x, y, z, w, d, h, color, o) {
    const out = [];
    const ax = (w >= d && w >= h) ? 0 : (d >= h ? 1 : 2);
    const len = [w, d, h][ax];
    const n = this._split ? Math.max(1, Math.ceil(len / 38)) : 1;
    const st = len / n;
    for (let i = 0; i < n; i++) {
      const part = ax === 0 ? this.gBox(x + i * st, y, z, st, d, h, color)
        : ax === 1 ? this.gBox(x, y + i * st, z, w, st, h, color)
          : this.gBox(x, y, z + i * st, w, d, st, color);
      this.gO(part, o);
      for (let k = 0; k < part.length; k++) { out.push(part[k]); }
    }
    return out;
  }

  /* prisma: polígono no plano XZ (axis 'y') ou YZ (axis 'x'), extrudado entre a e b */
  gExtrude(poly, a, b, color, axis) {
    const pt = (u, v, w) => (axis === 'x' ? [w, u, v] : [u, w, v]);
    let area = 0;
    for (let i = 0; i < poly.length; i++) {
      const p = poly[i], q = poly[(i + 1) % poly.length];
      area += p[0] * q[1] - q[0] * p[1];
    }
    const sg = area > 0 ? 1 : -1;
    const out = [];
    const cn = axis === 'x' ? [1, 0, 0] : [0, 1, 0];
    const tr = this.earClip(poly);
    out.push({ p: poly.map((p) => pt(p[0], p[1], a)), n: [-cn[0], -cn[1], -cn[2]], color, op: 1, tri: tr });
    out.push({ p: poly.map((p) => pt(p[0], p[1], b)), n: cn, color, op: 1, tri: tr });
    for (let i = 0; i < poly.length; i++) {
      const p = poly[i], q = poly[(i + 1) % poly.length];
      const du = q[0] - p[0], dv = q[1] - p[1];
      const l = Math.sqrt(du * du + dv * dv) || 1;
      const nu = (dv * sg) / l, nv = (-du * sg) / l;
      out.push({ p: [pt(p[0], p[1], a), pt(q[0], q[1], a), pt(q[0], q[1], b), pt(p[0], p[1], b)], n: axis === 'x' ? [0, nu, nv] : [nu, 0, nv], color, op: 1, soft: false });
    }
    return out;
  }

  /* disco com poucos lados (furos e parafusos) */
  gDiscN(cx, cy, cz, r, plane, color, n, sides) {
    const pts = [];
    const N = sides || 10;
    for (let i = 0; i < N; i++) {
      const a = (i / N) * 2 * Math.PI;
      const c = Math.cos(a) * r, s = Math.sin(a) * r;
      pts.push(plane === 'xy' ? [cx + c, cy + s, cz] : plane === 'yz' ? [cx, cy + c, cz + s] : [cx + c, cy, cz + s]);
    }
    return { p: pts, n, color, op: 1, flat: true };
  }

  /* caixa com cantos chanfrados: [0] topo, [1-4] chanfros do topo, [5-8] lados (frente, trás, esq., dir.), [9-12] quinas, [13-16] cantos */
  gRBox(x, y, z, w, d, h, color, r) {
    const x1 = x + w, y1 = y + d, z1 = z + h, zt = z1 - r, k = Math.SQRT1_2;
    const f = (p, n, soft) => ({ p, n, color, op: 1, soft: !!soft });
    return [
      f([[x + r, y + r, z1], [x1 - r, y + r, z1], [x1 - r, y1 - r, z1], [x + r, y1 - r, z1]], [0, 0, 1]),
      f([[x + r, y + r, z1], [x1 - r, y + r, z1], [x1 - r, y, zt], [x + r, y, zt]], [0, -k, k], true),
      f([[x1 - r, y1 - r, z1], [x + r, y1 - r, z1], [x + r, y1, zt], [x1 - r, y1, zt]], [0, k, k], true),
      f([[x + r, y1 - r, z1], [x + r, y + r, z1], [x, y + r, zt], [x, y1 - r, zt]], [-k, 0, k], true),
      f([[x1 - r, y + r, z1], [x1 - r, y1 - r, z1], [x1, y1 - r, zt], [x1, y + r, zt]], [k, 0, k], true),
      f([[x + r, y, z], [x1 - r, y, z], [x1 - r, y, zt], [x + r, y, zt]], [0, -1, 0]),
      f([[x1 - r, y1, z], [x + r, y1, z], [x + r, y1, zt], [x1 - r, y1, zt]], [0, 1, 0]),
      f([[x, y1 - r, z], [x, y + r, z], [x, y + r, zt], [x, y1 - r, zt]], [-1, 0, 0]),
      f([[x1, y + r, z], [x1, y1 - r, z], [x1, y1 - r, zt], [x1, y + r, zt]], [1, 0, 0]),
      f([[x + r, y, z], [x, y + r, z], [x, y + r, zt], [x + r, y, zt]], [-k, -k, 0], true),
      f([[x1, y + r, z], [x1 - r, y, z], [x1 - r, y, zt], [x1, y + r, zt]], [k, -k, 0], true),
      f([[x1 - r, y1, z], [x1, y1 - r, z], [x1, y1 - r, zt], [x1 - r, y1, zt]], [k, k, 0], true),
      f([[x, y1 - r, z], [x + r, y1, z], [x + r, y1, zt], [x, y1 - r, zt]], [-k, k, 0], true),
      f([[x + r, y, zt], [x, y + r, zt], [x + r, y + r, z1]], [-0.58, -0.58, 0.58], true),
      f([[x1 - r, y, zt], [x1, y + r, zt], [x1 - r, y + r, z1]], [0.58, -0.58, 0.58], true),
      f([[x1 - r, y1, zt], [x1, y1 - r, zt], [x1 - r, y1 - r, z1]], [0.58, 0.58, 0.58], true),
      f([[x + r, y1, zt], [x, y1 - r, zt], [x + r, y1 - r, z1]], [-0.58, 0.58, 0.58], true)
    ];
  }

  /* ---------- mancal (peça usinada) ---------- */
  pecaFaces(i) {
    const F = this.partFaces();
    const maps = [
      {},
      { '#AEB4BA': '#43474D', '#BCC2C8': '#50555C', '#98A0A8': '#3A3E44', '#DADEE1': '#8A9097' },
      { '#AEB4BA': '#C9CFD4', '#BCC2C8': '#D3D8DC', '#98A0A8': '#B7BDC3', '#DADEE1': '#E6E9EC' }
    ];
    const mp = maps[i] || {};
    let id = 1;
    F.forEach((fc) => {
      if (fc.floor) { fc.color = '#E9E9EC'; return; }
      if (mp[fc.color]) { fc.color = mp[fc.color]; }
      fc.metal = true;
      fc.oid = id++;
    });
    F.splice(1, 0, this.gFloor(-12, -12, 152, 102, '#D6D6DA'));
    return F;
  }

  /* ---------- mesa de aço (paramétrica) ---------- */
  mesaFaces(i) {
    const P = this.gFin('mesa')[i];
    const par = this._par || {};

    const F = [];
    const add = (a, o) => { this.gO(a, o); for (let k = 0; k < a.length; k++) { F.push(a[k]); } };
    const T = (x, y, z, w, d, h, c, o) => { const a = this.gTube(x, y, z, w, d, h, c, o); for (let k = 0; k < a.length; k++) { F.push(a[k]); } };
    const M = { metal: true };
    F.push(this.gFloor(-50, -40, L + 50, D + 40, '#E9E9EC'));
    F.push(this.gFloor(-12, -12, L + 12, D + 12, '#D6D6DA'));
    [8, L - 14].forEach((x) => [8, D - 14].forEach((y) => {
      T(x, y, 2, 6, 6, zt - 2, P.frame, M);
      add(this.gCyl(x + 3, y + 3, 0, 3.2, 2, 'z', '#17191C', 12));
      add(this.gCyl(x + 3, y + 3, 2, 1.6, 1.2, 'z', '#8A9097', 8), M);
    }));
    T(14, 8, zt - 8, L - 28, 4, 8, P.frame, M);
    T(14, D - 12, zt - 8, L - 28, 4, 8, P.frame, M);
    T(8, 14, zt - 8, 4, D - 28, 8, P.frame, M);
    T(L - 8, 14, zt - 8, 4, D - 28, 8, P.frame, M);
    T(14, 8, 18, L - 28, 4, 4, P.frame, M);
    T(14, D - 12, 18, L - 28, 4, 4, P.frame, M);
    T(8, 14, 18, 4, D - 28, 4, P.frame, M);
    T(L - 8, 14, 18, 4, D - 28, 4, P.frame, M);
    T(L / 2 - 2, 14, 18, 4, D - 28, 4, P.frame, M);
    [[14, zt, 1], [L - 14, zt, -1]].forEach((g) => {
      [8, D - 12].forEach((yy) => add(this.gExtrude([[g[0], g[1]], [g[0] + g[2] * 16, g[1]], [g[0], g[1] - 16]], yy, yy + 4, P.frame, 'y'), M));
    });
    [[14, zt, 1], [D - 14, zt, -1]].forEach((g) => {
      [8, L - 8].forEach((xx) => add(this.gExtrude([[g[0], g[1]], [g[0] + g[2] * 14, g[1]], [g[0], g[1] - 14]], xx, xx + 4, P.frame, 'x'), M));
    });
    [[20, 12], [L - 30, 12], [20, D - 18], [L - 30, D - 18], [10, D / 2], [L - 20, D / 2]].forEach((p) => {
      add(this.gBox(p[0], p[1] - 1, zt - 0.8, 10, 2.5, 0.8, '#8A9097'), M);
    });
    const top = this.gRBox(0, 0, zt, L, D, 3.5, P.top, 1.2);
    top[0].kids = [this.gDisc(L - 30, D - 20, H, 4.5, 'xy', 'rgba(10,10,10,0.7)', [0, 0, 1])];
    add(top);

  }

  /* ---------- escada metálica (paramétrica) ---------- */
  escadaFaces(i) {
    const P = this.gFin('escada')[i];
    const par = this._par || {};
    const N = par.N || 12, W = par.W || 90;
    const RISE = 17.5, RUN = 27, LX = RUN * N, HH = RISE * N;
    const F = [];
    const add = (a, o) => { this.gO(a, o); for (let k = 0; k < a.length; k++) { F.push(a[k]); } };
    const M = { metal: true };
    F.push(this.gFloor(-70, -60, LX + 80, W + 60, '#E9E9EC'));
    F.push(this.gFloor(-20, -20, LX + 26, W + 20, '#D6D6DA'));
    const prof = [[40, 0], [0, 0], [0, RISE - 4]];
    for (let k = 1; k <= N; k++) {
      prof.push([RUN * k, RISE * k - 4]);
      if (k < N) { prof.push([RUN * k, RISE * (k + 1) - 4]); }
    }
    prof.push([LX, HH - 4 - 22]);
    [0, W - 4].forEach((y0) => add(this.gExtrude(prof, y0, y0 + 4, P.steel, 'y'), M));
    for (let k = 1; k <= N; k++) {
      const tr = this.gRBox(RUN * (k - 1), 4, RISE * k - 4, RUN + 2.5, W - 8, 4, P.tread, 0.7);
      add(tr);
      [10, W - 10].forEach((yy) => add(this.gDiscN(RUN * k - 4, yy, RISE * k, 1.1, 'xy', '#2A2C30', [0, 0, 1], 8)));
    }
    const m = HH / LX;
    const posts = [];
    for (let x = 10; x < LX - 20; x += 81) { posts.push(x); }
    posts.push(LX - 8);
    posts.forEach((x) => {
      const zb = RISE * (Math.min(N - 1, Math.floor(x / RUN)) + 1);
      add(this.gTube(x - 2, -2, zb, 4, 4, 96, P.steel), M);
      add(this.gCyl(x, 0, zb, 2.6, 0.8, 'z', '#8A9097', 10), M);
    });
    add(this.gExtrude([[0, 100], [LX, 100 + HH], [LX, 105 + HH], [0, 105]], -2.5, 2.5, P.steel, 'y'), M);
    add(this.gExtrude([[0, 34], [LX, 34 + HH], [LX, 38 + HH], [0, 38]], -1.5, 1.5, P.steel, 'y'), M);
    for (let x = 22; x < LX; x += 14) {
      const zb = RISE * (Math.min(N - 1, Math.floor(x / RUN)) + 1);
      add(this.gTube(x - 0.7, -0.7, zb + 0.3, 1.4, 1.4, 100 + m * x - zb - 0.3, P.steel), M);
    }
    return F;
  }

  /* ---------- portão de correr (paramétrico) ---------- */
  portaoFaces(i) {
    const P = this.gFin('portao')[i];
    const par = this._par || {};
    const W = par.W || 300, Hh = par.H || 195;
    const F = [];
    const add = (a, o) => { this.gO(a, o); for (let k = 0; k < a.length; k++) { F.push(a[k]); } };
    const T = (x, y, z, w, d, h, c, o) => { const a = this.gTube(x, y, z, w, d, h, c, o); for (let k = 0; k < a.length; k++) { F.push(a[k]); } };
    const M = { metal: true };
    const conc = '#CFCDC8';
    const pt = Hh + 25;
    F.push(this.gFloor(-80, -80, W + 100, 100, '#E9E9EC'));
    add(this.gBox(-40, -10, 0, 40, 30, 4, '#BFBDB8'));
    add(this.gBox(W, -10, 0, 40, 30, 4, '#BFBDB8'));
    add(this.gBox(-30, -4, 4, 26, 24, pt - 4, conc));
    add(this.gBox(W, -4, 4, 26, 24, pt - 4, conc));
    add(this.gBox(-33, -7, pt, 32, 30, 6, '#B9B7B2'));
    add(this.gBox(W - 3, -7, pt, 32, 30, 6, '#B9B7B2'));
    add(this.gBox(-30, 3, 0, W + 46, 6, 3, '#8A9097'), M);
    [W * 0.1, W * 0.43, W * 0.77].forEach((x) => add(this.gCyl(x, 4.5, 3, 4.2, 3, 'y', '#2A2C30', 14)));
    T(0, 4, 8, W, 5, 5, P.c, M);
    T(0, 4, Hh - 5, W, 5, 5, P.c, M);
    T(0, 4, 8, 5, 5, Hh - 8, P.c, M);
    T(W - 5, 4, 8, 5, 5, Hh - 8, P.c, M);
    T(0, 4, 100, W, 5, 4, P.c, M);
    const sh = this.gBox(5, 5.5, 13, W - 10, 0.8, 87, P.c);
    sh[1].kids = [];
    const cols = Math.floor((W - 20) / 31);
    for (let r = 0; r < 4; r++) {
      for (let k = 0; k < cols; k++) {
        sh[1].kids.push({ p: [[16 + k * 31, 5.5, 22 + r * 19], [37 + k * 31, 5.5, 22 + r * 19], [37 + k * 31, 5.5, 26 + r * 19], [16 + k * 31, 5.5, 26 + r * 19]], color: '#D9D6D0' });
      }
    }
    add(sh, M);
    const nb = Math.floor((W - 12) / 12);
    for (let k = 0; k < nb; k++) { T(11 + k * 12, 5.2, 104, 2.2, 2.2, Hh - 109, P.c, M); }
    add(this.gBox(W / 2 - 15, 3, 94, 30, 2, 2, '#FF4A55'));
    add(this.gBox(W - 30, 1.6, 98, 18, 3, 6, '#9AA1A8'), M);
    add(this.gBox(W, -2, Hh + 1, 30, 12, 6, '#8A9097'), M);
    return F;
  }

  /* ---------- painel em chapa cortada a laser ---------- */

    const M = { metal: true };
    F.push(this.gFloor(-60, -70, 190, 70, '#E9E9EC'));

    /* parede ao fundo */

    /* chapa de 3 mm, com padrão vazado */
    const W = 120, H = 200, z0 = 12;
    const plate = this.gBox(0, 6, z0, W, 0.4, H, P.c);
    plate[1].kids = [];
    const cols = 12, rows = 20;
    for (let r = 0; r < rows; r++) {
      for (let k = 0; k < cols; k++) {
        const cx = 5 + k * 10, cz = z0 + 5 + r * 10;
        const wave = 0.5 + 0.5 * Math.sin(k * 0.55 + r * 0.32);
        const rad = 0.9 + wave * 3.4;
        plate[1].kids.push(this.gDiscN(cx, 6, cz, rad, 'xz', P.hole, [0, -1, 0], 8));
      }
    }
    add(plate, M);
    /* requadro dobrado nas bordas */
    add(this.gBox(0, 4, z0, 2.4, 3.2, H, P.c), M);
    add(this.gBox(W - 2.4, 4, z0, 2.4, 3.2, H, P.c), M);
    add(this.gBox(2.4, 4, z0, W - 4.8, 3.2, 2.4, P.c), M);
    add(this.gBox(2.4, 4, z0 + H - 2.4, W - 4.8, 3.2, 2.4, P.c), M);
    /* espaçadores e parafusos de fixação na parede */
    [[10, 24], [W - 10, 24], [10, H - 4], [W - 10, H - 4]].forEach((p) => {
      add(this.gCyl(p[0], 6.4, z0 + p[1] - 12, 2.2, 0, 'y', '#8A9097', 12), M);
      add(this.gCyl(p[0], 8.6, z0 + p[1] - 12, 1.2, 3.4, 'y', '#8A9097', 8), M);
    });
    return F;
  }

  /* ---------- totem de chapa dobrada com estrutura ---------- */
  totemFaces(i) {
    const P = this.gFin('totem')[i];
    const F = [];
    const add = (a, o) => { this.gO(a, o); for (let k = 0; k < a.length; k++) { F.push(a[k]); } };
    const T = (x, y, z, w, d, h, c, o) => { const a = this.gTube(x, y, z, w, d, h, c, o); for (let k = 0; k < a.length; k++) { F.push(a[k]); } };
    const MT = { layer: 'inner', metal: true }, CV = { layer: 'cover', metal: true }, EX = { layer: 'ext', metal: true };
    const steel = '#4A4F57';
    F.push(this.gFloor(-50, -50, 150, 110, '#E9E9EC'));
    F.push(this.gFloor(-12, -12, 112, 72, '#D6D6DA'));
    /* base: chapa grossa, parafusos e reforços */
    add(this.gRBox(0, 0, 0, 100, 60, 4, '#9AA1A8', 1.2), EX);
    [[10, 10], [90, 10], [10, 50], [90, 50]].forEach((p) => {

    T(42, 24, 4, 16, 12, 206, steel, MT);

    [28, 80, 132, 184].forEach((z) => {

    add(this.gBox(15, 45.5, 4, 70, 0.5, 202, P.body), CV);
    /* moldura e vidro da tela */
    const bz = this.gBox(15, 11, 60, 70, 2.5, 134, '#101215');
    bz[1].kids = [
      { p: [[19, 10.4, 64], [81, 10.4, 64], [81, 10.4, 190], [19, 10.4, 190]], color: '#25577F' },
      { p: [[19, 10.4, 152], [81, 10.4, 152], [81, 10.4, 159], [19, 10.4, 159]], color: P.top },
      { p: [[25, 10.4, 82], [75, 10.4, 82], [75, 10.4, 87], [25, 10.4, 87]], color: '#A8CBE6' },
      { p: [[25, 10.4, 95], [60, 10.4, 95], [60, 10.4, 99], [25, 10.4, 99]], color: '#A8CBE6' },
      { p: [[25, 10.4, 108], [68, 10.4, 108], [68, 10.4, 112], [25, 10.4, 112]], color: '#6F9FC4' },

    ];
    add(bz, { layer: 'ext' });
    add(this.gRBox(8, 10, 206, 84, 38, 14, P.top, 5), CV);
    add(this.gBox(14, 11, 22, 72, 1.5, 3, P.top), EX);
    add(this.gBox(14, 11, 42, 72, 1.5, 12, '#2A2D32'), EX);

  }

  polyItem(points, fill, stroke, op) {
    return { points, fill, stroke, op, tx: 0, ty: 0, label: '' };
  }

  /* ---------- rasterizador com z-buffer (visual de CAD) ---------- */

  rzParse(c) {
    this._pc = this._pc || {};
    if (this._pc[c]) { return this._pc[c]; }
    let out = [128, 128, 128, 1];
    if (typeof c === 'string') {
      if (c.charAt(0) === '#') {
        const n = parseInt(c.slice(1), 16);
        out = [(n >> 16) & 255, (n >> 8) & 255, n & 255, 1];
      } else {
        const m = c.match(/rgba?\(([^)]+)\)/);
        if (m) { const a = m[1].split(',').map(parseFloat); out = [a[0], a[1], a[2], a.length > 3 ? a[3] : 1]; }
      }
    }
    this._pc[c] = out;
    return out;
  }

  earClip(poly) {
    const n = poly.length;
    const idx = [];
    for (let i = 0; i < n; i++) { idx.push(i); }
    let area = 0;
    for (let i = 0; i < n; i++) { const p = poly[i], q = poly[(i + 1) % n]; area += p[0] * q[1] - q[0] * p[1]; }
    if (area < 0) { idx.reverse(); }
    const cr = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
    const tris = [];
    let guard = 0;
    while (idx.length > 3 && guard++ < 600) {
      let found = false;
      for (let i = 0; i < idx.length; i++) {
        const i0 = idx[(i + idx.length - 1) % idx.length], i1 = idx[i], i2 = idx[(i + 1) % idx.length];
        const a = poly[i0], b = poly[i1], c = poly[i2];
        if (cr(a, b, c) <= 1e-9) { continue; }
        let ok = true;
        for (let k = 0; k < idx.length; k++) {
          const j = idx[k];
          if (j === i0 || j === i1 || j === i2) { continue; }
          const pt = poly[j];
          if (cr(a, b, pt) >= 0 && cr(b, c, pt) >= 0 && cr(c, a, pt) >= 0) { ok = false; break; }
        }
        if (ok) { tris.push([i0, i1, i2]); idx.splice(i, 1); found = true; break; }
      }
      if (!found) { break; }
    }
    if (idx.length === 3) { tris.push([idx[0], idx[1], idx[2]]); }
    return tris;
  }

  rasterFrame(faces, o) {
    const W = o.W, H = o.H, K = o.K, mode = o.mode;
    const buf = new Uint8ClampedArray(W * H * 4);
    const zb = new Float32Array(W * H);
    zb.fill(1e9);
    const wire = mode === 'wire';

    /* fundo em degradê (como a janela do SolidWorks) */
    const bkey = (wire ? 'w' : 'r') + W + 'x' + H;
    if (!this._bg || this._bg.key !== bkey) {
      const bg = new Uint8ClampedArray(W * H * 4);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = (y * W + x) * 4;
          if (wire) { bg[i] = 238; bg[i + 1] = 244; bg[i + 2] = 251; bg[i + 3] = 255; continue; }
          const dx = x / W - 0.34, dy = y / H - 0.12;
          let r = Math.sqrt(dx * dx * 0.9 + dy * dy * 1.25) / 0.95;
          if (r > 1) { r = 1; }
          const t = r * r * (3 - 2 * r);
          bg[i] = 246 - t * 92; bg[i + 1] = 246 - t * 90; bg[i + 2] = 248 - t * 84; bg[i + 3] = 255;
        }
      }
      this._bg = { key: bkey, data: bg };
    }
    buf.set(this._bg.data);

    const pr = (p) => { const q = o.proj(p); return [q.u * K, q.v * K, q.d]; };
    const lv = o.lv, cam = o.cam, hv = o.hv;

    /* sombra suave no chão */
    if (o.foot && !wire && !o.plan) {
      const f = o.foot;
      const cs = [[f[0], f[1]], [f[2], f[1]], [f[2], f[3]], [f[0], f[3]]].map((q) => pr([q[0], q[1], 0]));
      let cx = 0, cy = 0;
      cs.forEach((q) => { cx += q[0] / 4; cy += q[1] / 4; });
      const e = [];
      for (let i = 0; i < 4; i++) {
        const a = cs[i], b = cs[(i + 1) % 4];
        let nx = b[1] - a[1], ny = a[0] - b[0];
        const l = Math.sqrt(nx * nx + ny * ny) || 1;
        nx /= l; ny /= l;
        if (nx * (cx - a[0]) + ny * (cy - a[1]) > 0) { nx = -nx; ny = -ny; }
        e.push([a[0], a[1], nx, ny]);
      }
      const blur = 16 * K / 1.6;
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      cs.forEach((q) => { x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); });
      x0 = Math.max(0, Math.floor(x0 - blur * 2)); x1 = Math.min(W - 1, Math.ceil(x1 + blur * 2));
      y0 = Math.max(0, Math.floor(y0 - blur * 2)); y1 = Math.min(H - 1, Math.ceil(y1 + blur * 2));
      for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
          let d = -1e9;
          for (let k = 0; k < 4; k++) {
            const q = e[k];
            const dd = (x - q[0]) * q[2] + (y - q[1]) * q[3];
            if (dd > d) { d = dd; }
          }
          let a = (blur - d) / (2 * blur);
          if (a <= 0) { continue; }
          if (a > 1) { a = 1; }
          a = a * a * (3 - 2 * a) * 0.34;
          const i = (y * W + x) * 4;
          buf[i] *= 1 - a; buf[i + 1] *= 1 - a; buf[i + 2] *= 1 - a;
        }
      }
    }

    /* cor de uma face (iluminação difusa, brilho e reflexo de metal) */
    const shade = (rgb, n, metal) => {
      const dif = Math.max(0, n[0] * lv[0] + n[1] * lv[1] + n[2] * lv[2]);
      let sp = Math.max(0, n[0] * hv[0] + n[1] * hv[1] + n[2] * hv[2]);
      sp *= sp; sp *= sp; sp *= sp; sp *= sp; sp *= sp;
      let k = 0.40 + 0.60 * dif;
      let add = 0;
      if (metal) {
        const nc = n[0] * cam[0] + n[1] * cam[1] + n[2] * cam[2];
        const rz = 2 * nc * n[2] - cam[2];
        const env = 0.5 + 0.5 * rz;
        k = k * (0.70 + 0.55 * env);
        add = sp * 210 + (n[2] > 0.5 ? 10 : 0);
      } else {
        add = sp * 30;
      }
      return [Math.min(255, rgb[0] * k + add), Math.min(255, rgb[1] * k + add), Math.min(255, rgb[2] * k + add)];
    };

    const edgeF = (ax, ay, bx, by, px, py) => (px - ax) * (by - ay) - (py - ay) * (bx - ax);

    /* triângulo com z-buffer; nrm = normais por vértice (sombreamento liso) */
    const fillTri = (A, B, C, col, alpha, useZ, writeZ, bias, nrm, metal, base) => {
      const area = edgeF(A[0], A[1], B[0], B[1], C[0], C[1]);
      if (area === 0) { return; }
      const minx = Math.max(0, Math.floor(Math.min(A[0], B[0], C[0])));
      const maxx = Math.min(W - 1, Math.ceil(Math.max(A[0], B[0], C[0])));
      const miny = Math.max(0, Math.floor(Math.min(A[1], B[1], C[1])));
      const maxy = Math.min(H - 1, Math.ceil(Math.max(A[1], B[1], C[1])));
      const inv = 1 / area;
      const pos = area > 0;
      for (let y = miny; y <= maxy; y++) {
        const py = y + 0.5;
        for (let x = minx; x <= maxx; x++) {
          const px = x + 0.5;
          const w0 = edgeF(B[0], B[1], C[0], C[1], px, py);
          const w1 = edgeF(C[0], C[1], A[0], A[1], px, py);
          const w2 = edgeF(A[0], A[1], B[0], B[1], px, py);
          if (pos ? (w0 < -0.5 || w1 < -0.5 || w2 < -0.5) : (w0 > 0.5 || w1 > 0.5 || w2 > 0.5)) { continue; }
          const b0 = w0 * inv, b1 = w1 * inv, b2 = w2 * inv;
          const z = b0 * A[2] + b1 * B[2] + b2 * C[2] + bias;
          const idx = y * W + x;
          if (useZ && z >= zb[idx]) { continue; }
          let r, g, b;
          if (nrm) {
            let nx = b0 * nrm[0][0] + b1 * nrm[1][0] + b2 * nrm[2][0];
            let ny = b0 * nrm[0][1] + b1 * nrm[1][1] + b2 * nrm[2][1];
            let nz = b0 * nrm[0][2] + b1 * nrm[1][2] + b2 * nrm[2][2];
            const l = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
            const c2 = shade(base, [nx / l, ny / l, nz / l], metal);
            r = c2[0]; g = c2[1]; b = c2[2];
          } else { r = col[0]; g = col[1]; b = col[2]; }
          const i = idx * 4;
          if (alpha >= 1) { buf[i] = r; buf[i + 1] = g; buf[i + 2] = b; buf[i + 3] = 255; } else {
            buf[i] += (r - buf[i]) * alpha; buf[i + 1] += (g - buf[i + 1]) * alpha; buf[i + 2] += (b - buf[i + 2]) * alpha;
          }
          if (writeZ) { zb[idx] = z; }
        }
      }
    };

    const splat = (x, y, a, rgb) => {
      const fx = x - 0.5, fy = y - 0.5;
      const ix = Math.floor(fx), iy = Math.floor(fy);
      const tx = fx - ix, ty = fy - iy;
      for (let dy = 0; dy < 2; dy++) {
        for (let dx = 0; dx < 2; dx++) {
          const px = ix + dx, py = iy + dy;
          if (px < 0 || py < 0 || px >= W || py >= H) { continue; }
          const w = (dx ? tx : 1 - tx) * (dy ? ty : 1 - ty) * a;
          const i = (py * W + px) * 4;
          buf[i] += (rgb[0] - buf[i]) * w; buf[i + 1] += (rgb[1] - buf[i + 1]) * w; buf[i + 2] += (rgb[2] - buf[i + 2]) * w;
        }
      }
    };

    const line = (A, B, rgb, alpha, useZ) => {
      const dx = B[0] - A[0], dy = B[1] - A[1];
      const len = Math.sqrt(dx * dx + dy * dy);
      const n = Math.max(1, Math.ceil(len / 0.8));
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        const x = A[0] + dx * t, y = A[1] + dy * t;
        if (useZ) {
          const ix = Math.round(x), iy = Math.round(y);
          if (ix < 0 || iy < 0 || ix >= W || iy >= H) { continue; }
          const z = A[2] + (B[2] - A[2]) * t;
          if (z > zb[iy * W + ix] + 1.4) { continue; }
        }
        splat(x, y, alpha, rgb);
      }
    };

    const tris = (fc, V) => {
      if (fc.tri) { return fc.tri; }
      const t = [];
      for (let i = 1; i < V.length - 1; i++) { t.push([0, i, i + 1]); }
      return t;
    };

    const dnOf = (n) => (n[0] * o.stt + n[1] * o.ct) * o.cf - n[2] * o.sf;
    const EDGE = [22, 24, 30];
    const BLUE = [11, 60, 111];

    const solid = (fc, V, withKids, zt) => {
      const useZ = zt !== false;
      const base = this.rzParse(fc.color);
      const flat = fc.vn ? null : shade(base, fc.n, fc.metal);
      const T = tris(fc, V);
      for (let k = 0; k < T.length; k++) {
        const t = T[k];
        if (fc.vn) { fillTri(V[t[0]], V[t[1]], V[t[2]], null, 1, useZ, true, 0, [fc.vn[t[0]], fc.vn[t[1]], fc.vn[t[2]]], fc.metal, base); } else {
          fillTri(V[t[0]], V[t[1]], V[t[2]], flat, 1, useZ, true, 0, null, false, null);
        }
      }
      if (withKids && fc.kids) {
        const kk = shade([255, 255, 255], fc.n, false)[0] / 255;
        fc.kids.forEach((kd, ki) => {
          const kv = kd.p.map(pr);
          const c = this.rzParse(kd.color);
          const col = [c[0] * (0.55 + 0.45 * kk), c[1] * (0.55 + 0.45 * kk), c[2] * (0.55 + 0.45 * kk)];
          for (let i = 1; i < kv.length - 1; i++) { fillTri(kv[0], kv[i], kv[i + 1], col, c[3], true, c[3] >= 1, -0.3 - ki * 0.03, null, false, null); }
        });
      }
    };

    const edges = (fc, V, alpha, rgb, useZ) => {
      for (let i = 0; i < V.length; i++) { line(V[i], V[(i + 1) % V.length], rgb, alpha, useZ); }
    };

    const list = faces.map((fc) => ({ fc, V: fc.p.map(pr), dn: dnOf(fc.n), layer: fc.layer || 'ext' }));
    const hasCover = list.some((e) => e.layer === 'cover');

    if (mode === 'render' || mode === 'estrutura') {
      const hid = mode === 'render' ? ['inner', 'foam'] : ['cover', 'foam'];
      const vis = list.filter((e) => hid.indexOf(e.layer) < 0 && e.dn < 0 && (!e.fc.floor || o.plan));
      vis.filter((e) => e.fc.floor).forEach((e) => solid(e.fc, e.V, true, false));
      vis.filter((e) => !e.fc.floor).forEach((e) => solid(e.fc, e.V, true));
      vis.forEach((e) => { if (!e.fc.soft && !e.fc.floor) { edges(e.fc, e.V, 0.8, EDGE, true); } });
    } else if (mode === 'xray') {
      if (hasCover) {
        const sol = list.filter((e) => e.layer !== 'cover' && e.dn < 0 && !e.fc.floor);
        sol.forEach((e) => solid(e.fc, e.V, true));
        sol.forEach((e) => { if (!e.fc.soft) { edges(e.fc, e.V, 0.7, EDGE, true); } });
        const cov = list.filter((e) => e.layer === 'cover' && e.dn < 0);
        cov.forEach((e) => {
          const c = shade(this.rzParse(e.fc.color), e.fc.n, false);
          const T = tris(e.fc, e.V);
          T.forEach((t) => fillTri(e.V[t[0]], e.V[t[1]], e.V[t[2]], c, 0.2, false, false, 0, null, false, null));
        });
        cov.forEach((e) => { if (!e.fc.soft) { edges(e.fc, e.V, 0.45, [60, 64, 72], false); } });
      } else {
        const all = list.filter((e) => !e.fc.floor);
        all.forEach((e) => {
          const c = shade(this.rzParse(e.fc.color), e.fc.n, false);
          const T = tris(e.fc, e.V);
          T.forEach((t) => fillTri(e.V[t[0]], e.V[t[1]], e.V[t[2]], c, e.dn < 0 ? 0.22 : 0.07, false, false, 0, null, false, null));
        });
        all.forEach((e) => { if (!e.fc.soft) { edges(e.fc, e.V, e.dn < 0 ? 0.6 : 0.28, [50, 54, 62], false); } });
      }
    } else {
      list.forEach((e) => {
        if (e.fc.floor) { edges(e.fc, e.V, 0.2, BLUE, false); return; }
        if (e.fc.soft) { if (e.dn < 0) { edges(e.fc, e.V, 0.16, BLUE, false); } return; }
        const front = e.dn < 0;
        edges(e.fc, e.V, front ? (e.layer === 'cover' ? 0.5 : 0.95) : 0.3, BLUE, false);
      });
    }
    return buf;
  }

  /* monta o quadro: geometria, câmera, rasterização, cotas e textos */
  renderFrame(sv, name, def) {
    const st = sv || this.state;
    name = name || 'main';
    const md = def || this.modelDef(st.model);
    let mode = st.mode || 'render';
    if (mode === 'estrutura' && !md.inner) { mode = 'render'; }
    const key = [st.model, mode, st.fin, st.yaw.toFixed(1), st.pitch.toFixed(1), st.zoom, st.dim ? 1 : 0, JSON.stringify(st.par || ''), st.ex || 0].join('|');
    this._fc = this._fc || {};
    if (this._fc[name] && this._fc[name].k === key) { return this._fc[name].u; }
    const W = 896, H = 616, K = W / 640;
    this._oid = 1;
    this._split = false;
    this._par = st.par || null;
    const faces = md.faces(md.fins.length ? st.fin % md.fins.length : 0);
    const c = md.c;
    const ex = st.ex || 0;
    this._parts = this._parts || {};
    const gs = {};
    faces.forEach((f) => { if (f.oid !== undefined && !f.floor) { (gs[f.oid] = gs[f.oid] || []).push(f); } });
    this._parts[name] = Object.keys(gs).length;
    if (ex > 0) {
      Object.keys(gs).forEach((id) => {
        let n = 0, sx = 0, sy = 0, sz = 0;
        gs[id].forEach((f) => { f.p.forEach((q) => { sx += q[0]; sy += q[1]; sz += q[2]; n++; }); });
        const dx = (sx / n - c[0]) * ex * 0.6, dy = (sy / n - c[1]) * ex * 0.6, dz = (sz / n - c[2]) * ex * 0.95 + ex * 4;
        const mv = (q) => [q[0] + dx, q[1] + dy, q[2] + dz];
        gs[id].forEach((f) => { f.p = f.p.map(mv); if (f.kids) { f.kids.forEach((kd) => { kd.p = kd.p.map(mv); }); } });
      });
    }
    const s = md.s * st.zoom / (1 + 0.45 * ex);
    const t = (st.yaw * Math.PI) / 180, f = (st.pitch * Math.PI) / 180;
    const ct = Math.cos(t), stt = Math.sin(t), cf = Math.cos(f), sf = Math.sin(f);
    const proj = (p) => {
      const x = p[0] - c[0], y = p[1] - c[1], z = p[2] - c[2];
      const x1 = x * ct - y * stt, y1 = x * stt + y * ct;
      return { u: 320 + x1 * s, v: 232 - (z * cf + y1 * sf) * s, d: y1 * cf - z * sf };
    };
    const light = [-0.35, -0.55, 0.75];
    const ll = Math.sqrt(light[0] * light[0] + light[1] * light[1] + light[2] * light[2]);
    const lv = [light[0] / ll, light[1] / ll, light[2] / ll];
    const cam = [-stt * cf, -ct * cf, sf];
    let hv = [lv[0] + cam[0], lv[1] + cam[1], lv[2] + cam[2]];
    const hl = Math.sqrt(hv[0] * hv[0] + hv[1] * hv[1] + hv[2] * hv[2]) || 1;
    hv = [hv[0] / hl, hv[1] / hl, hv[2] / hl];
    const buf = this.rasterFrame(faces, { W, H, K, mode, proj, lv, cam, hv, stt, ct, cf, sf, foot: md.foot, plan: st.model === 'planta' });
    this._lastBuf = { buf, W, H };
    if (typeof document === 'undefined') { return null; }
    this._cvs = this._cvs || {};
    let cv = this._cvs[name];
    if (!cv) { cv = this._cvs[name] = document.createElement('canvas'); cv.width = W; cv.height = H; }
    const ctx = cv.getContext('2d');
    ctx.putImageData(new ImageData(buf, W, H), 0, 0);
    ctx.textAlign = 'center';
    if (st.model === 'planta') {
      ctx.font = '700 ' + Math.round(13 * K) + 'px "Plus Jakarta Sans", Arial, sans-serif';
      ctx.lineJoin = 'round';
      this.planLabels().forEach((lb) => {
        const q = proj([lb.x, lb.y, 0.5]);
        ctx.lineWidth = 4 * K; ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.strokeText(lb.t, q.u * K, q.v * K);
        ctx.fillStyle = '#0A0A0B'; ctx.fillText(lb.t, q.u * K, q.v * K);
      });
    }
    if (st.dim && md.dims) {
      const col = mode === 'wire' ? '#0B3C6F' : '#1B1B1F';
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.2 * K;
      ctx.font = '700 ' + Math.round(13 * K) + 'px "Plus Jakarta Sans", Arial, sans-serif';
      ctx.lineJoin = 'round';
      md.dims.forEach((dm) => {
        const a = dm[0], b = dm[1], o2 = dm[2];
        const A = proj(a), B = proj(b);
        const A2 = proj([a[0] + o2[0], a[1] + o2[1], a[2] + o2[2]]);
        const B2 = proj([b[0] + o2[0], b[1] + o2[1], b[2] + o2[2]]);
        const X = (q) => q.u * K, Y = (q) => q.v * K;
        const ext = (P, P2) => {
          const dx = X(P2) - X(P), dy = Y(P2) - Y(P);
          const l = Math.sqrt(dx * dx + dy * dy) || 1;
          ctx.beginPath(); ctx.moveTo(X(P) + (dx / l) * 4 * K, Y(P) + (dy / l) * 4 * K); ctx.lineTo(X(P2) + (dx / l) * 5 * K, Y(P2) + (dy / l) * 5 * K); ctx.stroke();
        };
        ext(A, A2); ext(B, B2);
        ctx.beginPath(); ctx.moveTo(X(A2), Y(A2)); ctx.lineTo(X(B2), Y(B2)); ctx.stroke();
        const ang = Math.atan2(Y(B2) - Y(A2), X(B2) - X(A2));
        const arrow = (px, py, dir) => {
          const L = 9 * K, wd = 3.2 * K;
          const ux = Math.cos(ang) * dir, uy = Math.sin(ang) * dir;
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px - ux * L - uy * wd, py - uy * L + ux * wd);
          ctx.lineTo(px - ux * L + uy * wd, py - uy * L - ux * wd);
          ctx.closePath(); ctx.fill();
        };
        arrow(X(A2), Y(A2), -1); arrow(X(B2), Y(B2), 1);
        const mx = (X(A2) + X(B2)) / 2, my = (Y(A2) + Y(B2)) / 2;
        ctx.lineWidth = 4 * K; ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.strokeText(dm[3], mx, my - 5 * K);
        ctx.fillStyle = col; ctx.fillText(dm[3], mx, my - 5 * K);
        ctx.lineWidth = 1.2 * K; ctx.strokeStyle = col;
      });
    }
    let url = '';
    try { url = cv.toDataURL('image/jpeg', 0.92); } catch (e) { url = ''; }
    this._fc[name] = { k: key, u: url };
    return url;
  }

    const onWzReset = () => { this.setState({ wz: [null, null, null] }); };

      this.dragX = e.clientX;

      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
      if (this.state.auto) { this.setState({ auto: false }); }
    };
    const onMove = (e) => {
      if (this.dragX === null) { return; }
      const dx = e.clientX - this.dragX;
      const dy = e.clientY - this.dragY;
      this.dragX = e.clientX;
      this.dragY = e.clientY;
      const pitch = Math.max(10, Math.min(89, this.state.pitch + dy * 0.4));
      this.setState({ yaw: (this.state.yaw + dx * 0.6 + 360) % 360, pitch });
    };
    const onUp = () => { this.dragX = null; this.dragY = null; };

    return { chips, projects, modelTabs, viewButtons, modeButtons, finishButtons, finLabel, stage, modeNote, info, img: this.renderFrame(), wzOpts, wzDots, wzResult: wzDone ? [wzView] : [], wzView, onWzBack, onWzReset, onDown, onMove, onUp, onName, onEmail, onPhone, onService, onMsg, onSend, sent: st.sent };
  }
