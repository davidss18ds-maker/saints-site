/* ===== Visual moderno Saints ===== */
:root{--grad:linear-gradient(135deg,#E30613 0%,#FF3B47 55%,#FF7A45 100%);--glow:0 10px 24px rgba(227,6,19,.30);--card:0 1px 2px rgba(16,24,40,.04),0 10px 28px rgba(16,24,40,.06)}

.gs input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
/* saudação em destaque */
.hello{position:relative;overflow:hidden;background:radial-gradient(420px 220px at 95% 0%,rgba(255,59,71,.55),transparent 70%),radial-gradient(360px 200px at 70% 130%,rgba(255,122,69,.35),transparent 70%),linear-gradient(135deg,#12141A 0%,#1E0B10 100%);color:#fff;border-radius:24px;padding:24px clamp(18px,3vw,28px);margin:16px 0 16px;box-shadow:0 18px 40px rgba(18,20,26,.22);align-items:center}

.panel{border-radius:22px}

.wd.hj{background:linear-gradient(180deg,var(--soft),var(--surface));border-color:var(--accent);box-shadow:0 8px 20px rgba(227,6,19,.12)}
.wdh{display:flex;justify-content:space-between;align-items:baseline}.wdh b{font-size:13px}.wdh span{font-size:11px;color:var(--faint);font-weight:700}
.wd.hj .wdh b{color:var(--accent)}
.wdl{display:flex;flex-direction:column;gap:4px;flex:1}
.wdl em{font-style:normal;font-size:12px;color:var(--faint);margin-top:6px}
.wi{border:0;border-left:3px solid var(--faint);background:var(--surface);color:var(--fg);text-align:left;font:inherit;font-size:11.5px;line-height:1.3;padding:6px 8px;border-radius:8px;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05);display:block;width:100%;transition:transform .12s}
.wi span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wi:hover{transform:translateX(2px)}
.wi.ok{border-left-color:var(--ok)}.wi.warn{border-left-color:var(--warn)}.wi.bad{border-left-color:var(--bad);background:var(--badb)}.wi.info{border-left-color:var(--info)}
.wdt{font-size:12px;font-weight:800;text-align:right}.wdt.ok{color:var(--ok)}.wdt.bad{color:var(--bad)}
@media(max-width:1100px){.wk7{grid-template-columns:repeat(7,minmax(150px,1fr));overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}.wd{scroll-snap-align:start}}
.hmic{font-size:17px}

/* dias úteis */
.cd.we{background:repeating-linear-gradient(135deg,var(--col) 0 6px,transparent 6px 12px);opacity:.75}
.cd.we b{color:var(--faint)}
.wk5{grid-template-columns:repeat(5,minmax(0,1fr))}
/* barra inferior (só no celular) */
.tabbar{display:none}
@media(max-width:760px){
  .side{display:none}
  .app{grid-template-columns:minmax(0,1fr)}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:38;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(16,24,40,.08)}
  .tabbar button{border:0;background:none;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;font:inherit;font-size:11px;font-weight:700;border-radius:14px;position:relative}
  .tabbar i{font-style:normal;font-size:20px;line-height:1;transition:transform .15s}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar button[aria-current="page"] i{transform:translateY(-2px) scale(1.1)}
  .tabbar button[aria-current="page"]::before{content:"";position:absolute;top:-6px;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--grad)}
  .main{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
  .fab{bottom:calc(80px + env(safe-area-inset-bottom,0px));right:16px}
  .fabm{bottom:calc(144px + env(safe-area-inset-bottom,0px));right:16px}
  .undo{bottom:calc(82px + env(safe-area-inset-bottom,0px));right:84px}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .top{padding:12px 16px;gap:8px}
  .top h1{font-size:22px}
  .sync{display:none}
  .btn{min-height:44px}.btn.sm{min-height:38px}
  .hello{margin-top:12px;padding:18px}
  .hello h2{font-size:22px}
  .hbtn{width:100%}.hbtn .btn{flex:1}
  /* tabelas viram cartões */
  .tw{border:0;background:none;box-shadow:none;overflow:visible}
  .tw table{min-width:0;border-collapse:separate;border-spacing:0 10px}
  .tw thead{display:none}
  .tw tbody,.tw tfoot,.tw tr{display:block}
  .tw tr{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--card)}
  .tw td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:4px 0;text-align:right;background:none!important;white-space:normal}
  .tw td::before{content:attr(data-l);color:var(--faint);font-size:12px;font-weight:700;text-align:left;flex:none}
  .tw td[data-l=""]::before{display:none}
  .tw td:first-child{font-weight:800;font-size:15px;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
  .tw td:first-child::before{display:none}
  .tw td.r,.tw th.r{text-align:right}
  .tw tfoot tr{background:var(--soft)}
  /* quadro de projetos deslizando */
  .board{grid-template-columns:repeat(4,86%);scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 8px}
  .colm{scroll-snap-align:center}
  /* janelas */
  .dlg{max-height:92vh;border-radius:24px 24px 0 0}
  .foot .btn{flex:1 1 auto}
  .wk5{grid-template-columns:repeat(5,minmax(150px,1fr))}
}
/* menu "Mais" */
.mg{margin:14px 0 8px;font-size:12px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:16px;font:inherit;font-size:12px;font-weight:700;text-align:center;padding:8px;text-decoration:none}
.mt i{font-style:normal;font-size:22px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--accent)}
.mt.on{border-color:var(--accent);box-shadow:var(--glow)}
.autosv{font-size:11px;font-weight:800;color:var(--ok);background:var(--okb);border-radius:999px;padding:3px 10px;margin-left:auto;margin-right:8px;white-space:nowrap}

<script>
(function(){
var LS='saints-erp-v1',COLS=['cli','srv','orc','prj','tit','log','rcr','tar','ctr','anx','forn','vrf','lead','evt','bib','eqp','prs'];
var ME={adm:true,lvl:'Dono'},ADMC=['srv','orc','tit','rcr','ctr'];
var D={cli:{},srv:{},orc:{},prj:{},tit:{},log:{},rcr:{},tar:{},ctr:{},anx:{},forn:{},vrf:{},lead:{},evt:{},bib:{},eqp:{},prs:{}},CFG=null,mode='local',dbRef=null,dlRef=null,queue={};
var ui={view:'painel',modal:null,draft:null,filt:{orc:'todos',rec:'abertos',pag:'abertos',prj:''},q:{},arm:false,gq:''};
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var brl=function(v){return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});};
var brs=function(v){v=Number(v||0);return Math.abs(v)>=1000?'R$ '+(v/1000).toFixed(1).replace('.',',')+' mil':'R$ '+Math.round(v);};
var num=function(v){if(typeof v==='number'){return v;}var n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n;};
var r2=function(v){return Math.round(v*100)/100;};
var uid=function(){return 'x'+Math.random().toString(36).slice(2,8)+Date.now().toString(36);};
var clone=function(o){return JSON.parse(JSON.stringify(o));};
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function today(){var d=new Date();d.setHours(0,0,0,0);return d;}
function plus(n,from){var d=from?new Date(from+'T00:00:00'):today();d.setDate(d.getDate()+n);return iso(d);}
var TD=function(){return iso(today());};
function diff(s){return s?Math.round((new Date(s+'T00:00:00')-today())/864e5):null;}
function fd(s){if(!s){return '—';}var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2);}
function mkey(s){return s.slice(0,7);}
var MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function mlabel(k){return MESES[+k.slice(5,7)-1]+'/'+k.slice(2,4);}
function addM(k,n){var y=+k.slice(0,4),m=+k.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+('0'+(m+1)).slice(-2);}
var tt=null;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},2600);}
/* ---------- armazenamento ---------- */
function defCfg(){return {id:'main',seq:{ORC:0,PRJ:0,REC:0,PAG:0},auto:{os:true,tit:true,entrega:true,alerta:true,inicia:true,exigeCheck:true,rot:true,rec:true,juros:true,ctr:true},hora:120,multa:2,juros:1,seeded:false};}
function loadLocal(){try{var o=JSON.parse(localStorage.getItem(LS));if(o){COLS.forEach(function(c){D[c]=o.D&&o.D[c]||{};});CFG=Object.assign(defCfg(),o.cfg||{});}}catch(e){}if(!CFG){CFG=defCfg();}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({D:D,cfg:CFG}));}catch(e){}}
function setSync(t,off){$('#syncT').textContent=t;$('#sync').className='sync'+(off?' off':'');}
var wq=[],wBusy=0,wFail={},wPend={},wRun={};function okSync(){if(mode==='db'&&!wq.length&&!wBusy){setSync(ME.adm?'Salvo na nuvem':'Salvo na nuvem · acesso de '+ME.lvl.toLowerCase(),false);}}function tryW(fn,n){return Promise.resolve().then(fn).catch(function(e){if(n<3){return new Promise(function(r){setTimeout(r,1500*(n+1));}).then(function(){return tryW(fn,n+1);});}throw e;});}function chain(k,fn){wPend[k]=fn;if(wq.indexOf(k)<0){wq.push(k);}pump();}function pump(){while(wBusy<3&&wq.length){var i=0;while(i<wq.length&&wRun[wq[i]]){i++;}if(i>=wq.length){return;}pump1(wq.splice(i,1)[0]);}}function pump1(k){wBusy++;wRun[k]=1;var fn=wPend[k];delete wPend[k];if(wq.length>3){setSync('Salvando… ('+(wq.length+1)+')',false);}tryW(fn,0).then(function(){wBusy--;delete wRun[k];delete wFail[k];if(!wPend[k]){obxDel(k);}setTimeout(pump,80);okSync();},function(e){wBusy--;delete wRun[k];var c=(e&&(e.code||e.message))||'erro';wFail[k]=(wFail[k]||0)+1;if(wFail[k]<4){if(!wPend[k]){wPend[k]=fn;}if(wq.indexOf(k)<0){wq.push(k);}setSync('Sem resposta da nuvem · tentando de novo',true);setTimeout(pump,15000);}else{delete wFail[k];setSync('Erro ao salvar ('+c+')',true);toast('Não foi possível salvar um registro na nuvem ('+c+'). Ele continua nesta tela.');setTimeout(pump,200);}});}
function persist(c,id){
  if(mode==='db'&&!ME.adm&&(c==='cfg'||ADMC.indexOf(c)>=0)){return;}
  if(mode==='db'){var v=c==='cfg'?clone(CFG):(D[c][id]?clone(D[c][id]):null);obxSet(c+'/'+id,v);chain(c+'/'+id,function(){var d=dbRef.doc(c+'/'+id);return v?d.set(v):d.delete();});}
  else{saveLocal();}
}
function put(c,o){o=bizFix(c,o);if(REC&&c!=='log'){REC.push({c:c,id:o.id,prev:D[c][o.id]?clone(D[c][o.id]):null});}D[c][o.id]=o;persist(c,o.id);return o;}
function del(c,id){if(REC&&D[c][id]){REC.push({c:c,id:id,prev:clone(D[c][id])});}delete D[c][id];persist(c,id);}
function saveCfg(){persist('cfg','main');}
function addLog(msg){put('log',{id:uid(),ts:Date.now(),msg:msg});}
function nextNum(s){CFG.seq[s]=(CFG.seq[s]||0)+1;saveCfg();return s+'-'+('000000'+CFG.seq[s]).slice(-6);}
function L(c){return Object.keys(D[c]).map(function(k){return D[c][k];});}
/* ---------- regras de negócio ---------- */
function orcSub(o){return (o.itens||[]).reduce(function(t,i){return t+num(i.qtd)*num(i.valor);},0);}
function orcTotal(o){var s=orcSub(o);return r2(s-s*(num(o.desc)||0)/100);}
function pago(t){return r2((t.bx||[]).reduce(function(s,b){return s+num(b.v);},0));}
function saldo(t){return Math.max(0,r2(num(t.valor)-pago(t)));}
function tstat(t){if(saldo(t)<=0.004){return 'pago';}if(t.venc&&t.venc<TD()){return 'vencido';}return pago(t)>0?'parcial':'aberto';}
function cliNome(id){return D.cli[id]?D.cli[id].nome:'—';}
function orcHoras(o){return (o.itens||[]).reduce(function(t,i){var s=D.srv[i.srvId];return t+(s?num(s.horas)*num(i.qtd):0);},0);}
function aprovar(id){
  var o=D.orc[id];if(!o||o.status==='aprovado'){return;}
  var tot=orcTotal(o);if(!o.cliId||!(tot>0)){toast('Informe o cliente e ao menos um item com valor.');return false;}
  o=clone(o);o.status='aprovado';o.aprov=TD();var msg=['Orçamento '+o.num+' aprovado'];
  if(CFG.auto.os){var p={id:uid(),num:nextNum('PRJ'),orcId:o.id,cliId:o.cliId,titulo:o.titulo,status:'fila',prazo:plusU(num(o.prazoDias)||7),horasEst:orcHoras(o),ap:[],valor:tot,criado:TD(),notas:'',prioridade:'normal',ck:ckDefault()};put('prj',p);o.prjId=p.id;msg.push('projeto '+p.num+' criado');}
  o.titIds=[];
  if(CFG.auto.tit){
    var sin=r2(tot*(num(o.sinal)||0)/100),sal=r2(tot-sin),prz=num(o.prazoDias)||7;
    if(sin>0){var t1={id:uid(),num:nextNum('REC'),tipo:'R',cliId:o.cliId,desc:'Sinal '+o.sinal+'% · '+o.titulo,valor:sin,venc:plus(3),bx:[],orcId:o.id,kind:'sinal'};put('tit',t1);o.titIds.push(t1.id);}
    var t2={id:uid(),num:nextNum('REC'),tipo:'R',cliId:o.cliId,desc:(sin>0?'Saldo na entrega · ':'Pagamento · ')+o.titulo,valor:sal,venc:plus(num((D.cli[o.cliId]||{}).condPag)||5,plusU(prz)),bx:[],orcId:o.id,kind:'saldo'};put('tit',t2);o.titIds.push(t2.id);
    msg.push((sin>0?'2 cobranças':'1 cobrança')+' geradas');
  }
  put('orc',o);if(ao('ctr')){var cc=mkCtr(o);if(cc){msg.push('contrato '+cc.num+' em rascunho');}}addLog(msg.join(', '));toast(msg.join(' · '));return true;
}
function entregar(id){
  var p=D.prj[id];if(!p||p.status==='entregue'){return;}p=clone(p);p.status='entregue';p.entregue=TD();put('prj',p);var m='Projeto '+p.num+' entregue';
  if(CFG.auto.entrega){var n=0;L('tit').forEach(function(t){if(t.orcId===p.orcId&&t.kind==='saldo'&&saldo(t)>0&&t.venc>plus(5)){t=clone(t);t.venc=plus(5);put('tit',t);n++;}});if(n){m+=', saldo com vencimento em 5 dias';}}
  addLog(m);toast(m);
}
var PST=['fila','desenho','revisao','entregue'],PNM={fila:'Na fila',desenho:'Em desenho',revisao:'Em revisão',entregue:'Entregue'};
function moveP(id,d){var p=D.prj[id];var i=PST.indexOf(p.status)+d;if(i<0||i>=PST.length){return;}if(PST[i]==='entregue'){entregar(id);return;}p=clone(p);p.status=PST[i];put('prj',p);addLog('Projeto '+p.num+' → '+PNM[p.status]);}
/* ---------- pendências (automação) ---------- */
function pend(){
  var a=[];
  L('prj').forEach(function(p){if(p.status!=='entregue'&&p.prazo&&p.prazo<TD()){a.push({k:'bad',t:'Projeto atrasado',s:p.num+' · '+p.titulo+' · prazo '+fd(p.prazo),o:['prj',p.id]});}});
  L('tit').forEach(function(t){if(t.tipo==='R'&&tstat(t)==='vencido'){a.push({k:'bad',t:'Cobrança vencida',s:cliNome(t.cliId)+' · '+brl(saldo(t))+' · venc. '+fd(t.venc),o:['tit',t.id],cob:t.id});}
    else if(t.tipo==='R'&&tstat(t)!=='pago'&&diff(t.venc)<=3&&diff(t.venc)>=0){a.push({k:'warn',t:'Vence em '+diff(t.venc)+' d',s:cliNome(t.cliId)+' · '+brl(saldo(t)),o:['tit',t.id]});}
    else if(t.tipo==='P'&&tstat(t)!=='pago'&&diff(t.venc)!==null&&diff(t.venc)<=3){a.push({k:diff(t.venc)<0?'bad':'warn',t:diff(t.venc)<0?'Conta a pagar vencida':'Conta a pagar vence logo',s:t.desc+' · '+brl(saldo(t))+' · '+fd(t.venc),o:['tit',t.id]});}});
  L('orc').forEach(function(o){if(o.status==='enviado'&&o.enviado&&diff(o.enviado)<=-7){a.push({k:'info',t:'Orçamento sem resposta há '+(-diff(o.enviado))+' dias',s:o.num+' · '+cliNome(o.cliId)+' · '+brl(orcTotal(o)),o:['orc',o.id]});}});
  L('prj').forEach(function(p){if(p.status==='entregue'){L('tit').forEach(function(t){if(t.orcId===p.orcId&&t.tipo==='R'&&saldo(t)>0&&tstat(t)!=='vencido'&&diff(t.venc)>3){a.push({k:'info',t:'Entregue com saldo a receber',s:p.num+' · '+brl(saldo(t))+' · venc. '+fd(t.venc),o:['tit',t.id]});}});}});
  return a;
}
/* ---------- componentes ---------- */
function tag(t,k){return '<span class="tag '+(k||'')+'">'+esc(t)+'</span>';}
var OST={rascunho:['Rascunho',''],enviado:['Enviado','info'],aprovado:['Aprovado','ok'],recusado:['Recusado','bad']};
function ostag(s){return tag(OST[s][0],OST[s][1]);}
function tstag(t){var s=tstat(t);return tag({pago:'Pago',vencido:'Vencido',parcial:'Parcial',aberto:'Em aberto'}[s],{pago:'ok',vencido:'bad',parcial:'warn',aberto:''}[s]);}
function empty(msg){return '<div class="empty">'+msg+'</div>';}
function tel(c){var d=String(c&&c.tel||'').replace(/\D/g,'');if(!d){return '';}return d.length<=11?'55'+d:d;}
function waHref(c,msg){var t=tel(c);return 'https://wa.me/'+t+'?text='+encodeURIComponent(msg);}
function orcMsg(o){var c=D.cli[o.cliId];var m='Olá'+(c?', '+c.nome.split(' ')[0]:'')+'! Segue a proposta '+(o.num||'')+' - '+o.titulo+'\n\n';(o.itens||[]).forEach(function(i){m+='• '+(i.desc||'Item')+' ('+num(i.qtd)+'x): '+brl(num(i.qtd)*num(i.valor))+'\n';});var tot=orcTotal(o);m+='\n*Total: '+brl(tot)+'*';if(num(o.desc)){m+=' (desconto de '+o.desc+'%)';}if(num(o.sinal)){m+='\nSinal de '+o.sinal+'%: '+brl(r2(tot*o.sinal/100))+', restante na entrega.';}if(o.pgto){m+='\nPagamento: '+o.pgto+'.';}if(o.escopo){m+='\nEscopo: '+o.escopo;}m+='\nPrazo: '+(o.prazoDias||7)+' dias úteis. Válida por '+(o.validade||7)+' dias.\nInclui 2 revisões. Não inclui fabricação, material nem montagem.\n\nSaints Projetos · Precisão em cada detalhe';return m;}
function cobMsg(t){var c=D.cli[t.cliId];return 'Olá'+(c?', '+c.nome.split(' ')[0]:'')+', tudo bem? Aqui é o David, da Saints Projetos. O pagamento "'+t.desc+'", de '+brl(saldo(t))+' com vencimento em '+fd(t.venc)+', consta em aberto. Pode me confirmar a data do pagamento? Obrigado!';}
function svgBars(ms,series,h){
  var W=560,H=h||190,pl=8,pb=26,pt=14,n=ms.length,gw=(W-pl*2)/n,mx=1;
  series.forEach(function(s){s.v.forEach(function(v){if(v>mx){mx=v;}});});
  var out='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Gráfico mensal">';
  out+='<line x1="'+pl+'" x2="'+(W-pl)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line2)"/>';
  ms.forEach(function(m,i){
    var bw=Math.min(34,gw/(series.length+1)),x0=pl+i*gw+(gw-bw*series.length-4*(series.length-1))/2;
    series.forEach(function(s,j){var v=s.v[i],bh=Math.max(v>0?2:0,v/mx*(H-pb-pt-14)),x=x0+j*(bw+4);
      out+='<rect x="'+x+'" y="'+(H-pb-bh)+'" width="'+bw+'" height="'+bh+'" rx="5" style="fill:'+s.c+'"/>';
      if(v>0){out+='<text x="'+(x+bw/2)+'" y="'+(H-pb-bh-4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor">'+brs(v).replace('R$ ','')+'</text>';}});
    out+='<text x="'+(pl+i*gw+gw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">'+mlabel(m)+'</text>';
  });
  return out+'</svg>';
}
/* ---------- views ---------- */
function vPainel(){
  var mk=mkey(TD()),rec=0,vencido=0,receber=0,pagar30=0,andam=0;
  L('tit').forEach(function(t){(t.bx||[]).forEach(function(b){if(t.tipo==='R'&&mkey(b.d)===mk){rec+=num(b.v);}});
    if(t.tipo==='R'){receber+=saldo(t);if(tstat(t)==='vencido'){vencido+=saldo(t);}}
    if(t.tipo==='P'&&saldo(t)>0&&diff(t.venc)!==null&&diff(t.venc)<=30){pagar30+=saldo(t);}});
  L('prj').forEach(function(p){if(p.status!=='entregue'){andam++;}});
  var dec=L('orc').filter(function(o){return o.status==='aprovado'||o.status==='recusado';}),apr=dec.filter(function(o){return o.status==='aprovado';}).length;
  var atras=L('prj').filter(function(p){return p.status!=='entregue'&&p.prazo&&p.prazo<TD();}).length;

var CEN=[['otim','Otimista','Tudo entra no vencimento; vencidos na 1ª semana.',0,1,3],['real','Realista','Recebimentos atrasam 7 dias; 60% dos vencidos entram em 10 dias.',7,.6,10],['cons','Conservador','Recebimentos atrasam 15 dias; 30% dos vencidos entram em 21 dias.',15,.3,21]];
function projCaixa(cen,ini){
  var W=13,ent=[],sai=[],ds=[];for(var i=0;i<W;i++){ent.push(0);sai.push(0);ds.push(plus(i*7));}
  function wk(n){return Math.max(0,Math.min(W-1,Math.floor(n/7)));}
  L('tit').forEach(function(t){var s=saldo(t);if(!(s>0)||!t.venc){return;}var d=diff(t.venc);
    if(t.tipo==='R'){if(d<0){var k=wk(cen[5]);ent[k]+=s*cen[4];}else{var q=d+cen[3];if(q<W*7){ent[wk(q)]+=s;}}}
    else{var q2=Math.max(0,d);if(q2<W*7){sai[wk(q2)]+=s;}}});
  var acc=ini,sd=[],minV=ini,minW=0;for(var j=0;j<W;j++){acc+=ent[j]-sai[j];sd.push(acc);if(acc<minV){minV=acc;minW=j;}}
  return {W:W,ent:ent,sai:sai,sd:sd,ds:ds,min:minV,minW:minW,fim:acc};
}
function svgLine(sd,ini){
  var W=560,H=190,pl=10,pr=10,pt=16,pb=26,n=sd.length,all=sd.concat([ini,0]),mx=Math.max.apply(null,all),mn=Math.min.apply(null,all);if(mx===mn){mx=mn+1;}
  var X=function(i){return pl+i*(W-pl-pr)/(n-1);},Y=function(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb);};
  var pts=sd.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}).join(' ');
  var o='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Saldo projetado por semana">';
  if(mn<0){o+='<rect x="'+pl+'" y="'+Y(0)+'" width="'+(W-pl-pr)+'" height="'+(H-pb-Y(0))+'" style="fill:var(--badb)"/>';}
  o+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--line2)" stroke-dasharray="4 4"/>';
  o+='<polyline points="'+pts+'" fill="none" style="stroke:var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  sd.forEach(function(v,i){o+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3.5" style="fill:var(--accent)"/>';if(i%3===0||i===n-1){o+='<text x="'+X(i)+'" y="'+(Y(v)-9)+'" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor">'+brs(v).replace('R$ ','')+'</text>';}
    if(i%2===0){o+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="currentColor" opacity=".7">S'+(i+1)+'</text>';}});
  return o+'</svg>';
}

function simCalc(s){var hora=cg('hora',120),h=num(s.h),ex=num(s.ex),mg=num(s.mg)/100,im=num(s.im)/100,cost=h*hora+ex,den=1-mg-im;return {cost:cost,den:den,preco:den>0.01?cost/den:0,imp:0,h:h,mg:mg,im:im};}

function stale(tk){
  var r=tk.ref||[],k=tk.id||'';
  if(r[0]==='tit'){var t=D.tit[r[1]];return !t||saldo(t)<=0.004;}
  if(/^nf_/.test(k)){var tn=D.tit[r[1]];return !tn||!!tn.nf;}
  if(r[0]==='ctr'){var cx=D.ctr[r[1]];if(!cx){return true;}return /^ctr_env_/.test(k)?cx.status!=='rascunho':cx.status!=='enviado';}
  if(r[0]==='orc'){var o=D.orc[r[1]];if(!o){return true;}return /^rasc_/.test(k)?o.status!=='rascunho':o.status!=='enviado';}
  if(r[0]==='prj'){var p=D.prj[r[1]];if(!p){return true;}if(/^pos/.test(k)){return false;}return p.status==='entregue';}
  if(r[0]==='cli'&&/^rea_/.test(k)){return L('orc').some(function(o){return o.cliId===r[1]&&o.data>tk.criada;});}
  return false;
}

function regexAcao(q){

  return r2(Math.max(0,ir-red));

/* ---- Firestore: conversão de valores ---- */
function toFs(v){if(v===null||v===undefined){return {nullValue:null};}if(typeof v==='boolean'){return {booleanValue:v};}if(typeof v==='number'){return Number.isInteger(v)&&Math.abs(v)<9e15?{integerValue:String(v)}:{doubleValue:v};}if(typeof v==='string'){return {stringValue:v};}
  if(Array.isArray(v)){return {arrayValue:{values:v.map(toFs)}};}var f={};Object.keys(v).forEach(function(k){if(v[k]!==undefined){f[k]=toFs(v[k]);}});return {mapValue:{fields:f}};}
function fromFs(x){if(!x){return null;}if('stringValue' in x){return x.stringValue;}if('integerValue' in x){return parseInt(x.integerValue,10);}if('doubleValue' in x){return x.doubleValue;}if('booleanValue' in x){return x.booleanValue;}if('nullValue' in x){return null;}if('timestampValue' in x){return x.timestampValue;}
  if('arrayValue' in x){return (x.arrayValue.values||[]).map(fromFs);}if('mapValue' in x){var o={},f=x.mapValue.fields||{};Object.keys(f).forEach(function(k){o[k]=fromFs(f[k]);});return o;}return null;}
function docObj(d){var o={},f=d.fields||{};Object.keys(f).forEach(function(k){if(k!=='_ts'){o[k]=fromFs(f[k]);}});return {id:decodeURIComponent(d.name.split('/').pop()),v:o,ts:f._ts?f._ts.timestampValue:''};}

function fbLogin(email,senha){return fbAuth('accounts:signInWithPassword',{email:email,password:senha,returnSecureToken:true}).then(function(j){fbSessSet({uid:j.localId,email:j.email,id:j.idToken,rf:j.refreshToken,exp:Date.now()+(+j.expiresIn-120)*1000});return FB.sess;});}

  return fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(FB.cfg.apiKey),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(s.rf)}).then(function(r){return r.json().then(function(j){if(!r.ok){throw new Error((j.error&&j.error.message)||'SESSAO');}s.id=j.id_token;s.rf=j.refresh_token;s.exp=Date.now()+(+j.expires_in-120)*1000;fbSessSet(s);return s.id;});});}
/* ---- Firestore REST ---- */
function fbBase(){return 'https://firestore.googleapis.com/v1/projects/'+FB.cfg.projectId+'/databases/(default)/documents';}
function fbName(c,id){return 'projects/'+FB.cfg.projectId+'/databases/(default)/documents/'+c+'/'+encodeURIComponent(id);}
function fbReq(method,url,body){return fbToken().then(function(t){return fetch(url,{method:method,headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});}).then(function(r){if(r.status===404&&method==='GET'){return null;}return r.text().then(function(tx){var j=tx?JSON.parse(tx):{};if(!r.ok){var e=new Error((j.error&&(j.error.status||j.error.message))||('HTTP '+r.status));e.code=r.status===403?'sem permissão':r.status;throw e;}return j;});});}
function fbWrite(c,id,v){var w={update:{name:fbName(c,id),fields:toFs(v).mapValue.fields},updateTransforms:[{fieldPath:'_ts',setToServerValue:'REQUEST_TIME'}]};return fbReq('POST',fbBase()+':commit',{writes:[w]});}
function fbList(c){var out=[],go=function(tk){return fbReq('GET',fbBase()+'/'+c+'?pageSize=300'+(tk?'&pageToken='+encodeURIComponent(tk):'')).then(function(j){((j&&j.documents)||[]).forEach(function(d){out.push(docObj(d));});return j&&j.nextPageToken?go(j.nextPageToken):out;});};return go('');}
function fbSince(c,ts){return fbReq('POST',fbBase()+':runQuery',{structuredQuery:{from:[{collectionId:c}],where:{fieldFilter:{field:{fieldPath:'_ts'},op:'GREATER_THAN',value:{timestampValue:ts}}}}}).then(function(arr){return (arr||[]).filter(function(x){return x.document;}).map(function(x){return docObj(x.document);});});}

  return "rules_version = '2';\n// Saints ERP · regras de acesso por perfil (geradas pelo app)\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function logado() { return request.auth != null; }\n    function dono() { return logado() && request.auth.token.email == '"+owner.toLowerCase()+"'; }\n    function u() { return get(/databases/$(database)/documents/usuarios/$(request.auth.uid)).data; }\n    function tem() { return logado() && exists(/databases/$(database)/documents/usuarios/$(request.auth.uid)); }\n    function perfil() { return dono() ? 'admin' : (tem() && u().ativo != false ? u().perfil : 'nenhum'); }\n"+
  "    function le(c) { let p = perfil(); return p == 'admin' || (p == 'fin' && c in "+q(PR.fin)+") || (p == 'adm' && c in "+q(PR.adm)+") || (p == 'ti' && c in "+q(PR.ti)+") || (p == 'aux' && c in "+q(PR.aux)+"); }\n"+
  "    function grava(c) { let p = perfil(); return p == 'admin' || (p == 'fin' && c in "+q(PW.fin)+") || (p == 'adm' && c in "+q(PW.adm)+") || (p == 'ti' && c in "+q(PW.ti)+") || (p == 'aux' && c in "+q(PW.aux)+"); }\n\n"+
  "    match /usuarios/{uid} {\n      allow read: if logado() && (request.auth.uid == uid || perfil() in ['admin','ti']);\n      allow create, update: if perfil() == 'admin' || (perfil() == 'ti' && request.resource.data.perfil != 'admin') || (dono() && request.auth.uid == uid);\n      allow delete: if perfil() == 'admin';\n    }\n    match /cfg/main {\n      allow read: if perfil() != 'nenhum';\n      allow write: if perfil() in ['admin','fin','adm','ti'];\n    }\n    match /cfg/rh {\n      allow read, write: if perfil() in ['admin','fin'];\n    }\n    match /del/{d} {\n      allow read: if perfil() != 'nenhum';\n      allow create, update: if perfil() == 'admin';\n    }\n    match /aud/{a} {\n      allow read: if perfil() == 'admin';\n      allow create, update: if perfil() != 'nenhum' && request.resource.data.uid == request.auth.uid;\n    }\n    match /{col}/{id} {\n      allow read: if col != 'usuarios' && col != 'cfg' && col != 'del' && col != 'aud' && le(col);\n      allow create, update: if col != 'usuarios' && col != 'cfg' && col != 'del' && col != 'aud' && grava(col);\n      allow delete: if perfil() == 'admin';\n    }\n  }\n}\n";}
